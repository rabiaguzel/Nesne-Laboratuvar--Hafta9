e:12px;font-weight:700;fill:#5e778b!important}.subline{font-size:14px;color:#728496}.memory{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:200px}.mem-col{background:#f2f6fa;border:1px solid #e0e9ef;border-radius:12px;padding:16px}.mem-col h3{color:#697c8c;font-size:13px;text-transform:uppercase;letter-spacing:1px}.mem-row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #dce6ee;padding:14px;margin:12px 0;border-radius:10px;font-family:ui-monospace,monospace;font-weight:700}.mem-arrow{color:#1e90a0}.obj-card{background:#d7eff5;border:1px solid #77bbc9;border-radius:10px;margin:12px 0;padding:14px;color:#164756}.obj-card.muted{opacity:.35}.step-control{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-top:16px}.step-dots{display:flex;gap:6px}.step-dot{width:8px;height:8px;background:#d0dbe2;border-radius:5px}.step-dot.on{background:#457a9b}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.choice{padding:15px;text-align:left;border:1px solid #d5e1e8;border-radius:12px;background:#fff;color:#30445a;font-weight:700;min-height:65px}.choice.selected{background:#e8f7d3;border:2px solid #8cc83e;color:#27431a;padding:14px}.choice small{display:block;font-weight:500;margin-top:5px}.contract{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.contract-card{border-radius:13px;border:1px solid #dce4e8;background:#f8fafb;padding:17px}.contract-card .symbol{font-size:22px;color:#346a83}.contract-card strong{display:block;margin:10px 0 5px}.contract-card p{font-size:13px;color:#66798c;line-height:1.55;margin:0}.build-preview{border:1px solid #b8d1df;padding:18px;border-radius:13px;background:#eff7fb}.build-preview .preview-line{border-bottom:1px solid #b8d1df;padding:7px 0;font:14px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}.sorted-item{display:flex;justify-content:space-between;align-items:center;background:#f3f7fb;border: kground:#15253a;border:1px solid #273e53;border-radius:15px;padding:20px;margin-top:32px;color:#d7e6f0}.mission-meter .bar{display:flex;gap:5px;margin:15px 0}.mission-meter .bar span{flex:1;height:8px;background:#30475a;border-radius:6px}.mission-meter .bar span.on{background:#bdf27b}.error{font-size:13px;color:#bd4246;margin-top:8px}.download-box{background:#eff8e5;border:1px solid #b3d890;border-radius:15px;padding:21px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.checklist{display:grid;gap:11px}.checkline{display:flex;align-items:center;gap:9px;font-size:14px}.checkline b{min-width:20px}.muted{color:#728395}.separate{border:0;border-top:1px solid #e3ebf0;margin:22px 0}.outline-code{display:inline-block;font:700 18px ui-monospace,monospace;border-radius:9px;background:#18314e;color:#d4f5af;padding:14px 18px;letter-spacing:.5px;word-break:break-all}.pdf-preview{background:white;border:1px solid #dde8ec;border-radius:14px;padding:20px}.mobile-progress{display:none}

<body>
  <div id="app"></div>
  <script>
/*
  OOP Nesne Laboratuvarı — self-contained student activity.
  All work stays in this browser. Java snippets are not executed or graded.
  The offline identity marker is an organizational code, not an authentication signature.
*/
(() => {
  'use strict';
  const KEY = 'oop-nesne-lab-v1';
  const lessons = [
    {title:'UML Sinyal Masası', short:'UML ilişkileri', minutes:8, topic:'Sınıflar arasındaki bağı çizimde tanı'},
    {title:'Bellekte İki İsim', short:'Nesne & sınıf', minutes:7, topic:'Nesne kimliği ve sınıf üyelerini ayırt et'},
    {title:'Enerji Güvenlik Kilidi', short:'Kapsülleme', minutes:9, topic:'Veriyi koru, geçersiz durumu engelle'},
    {title:'Miras Zinciri', short:'Kalıtım & super', minutes:10, topic:'Kurucuların sırasını ve super kullanımını çöz'},
    {title:'Sözleşme Panosu', short:'Interface', minutes:8, topic:'Yetenekleri doğru arayüzlerle modelle'},
    {title:'Soyut Filo', short:'Abstract class', minutes:8, topic:'Ortak gövde ile zorunlu davranışı ayır'},
    {title:'Son Tasarım: Amfibi', short:'Bütünleştirme', minutes:8, topic:'Mimariyi kur ve Java ile savun'}
  ];
  const memberChips = [
    {code:'private int enerji;', id:'field'},
    {code:'public Drone(String kod) { ... }', id:'constructor'},
    {code:'public void gorevBaslat() { ... }', id:'method'},
    {code:'Drone d = new Drone("D-7");', id:'object'}
  ];
  const init = () => ({id:'', startedAt:0, view:0, answers:{}, step:0, visited:[], order:[2,0,3,1], savedAt:0});
  let state = init();
  try {
    const prior = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (prior && typeof prior === 'object' && prior.answers && typeof prior.answers === 'object') state = {...init(), ...prior};
  } catch (_) {}
  const root = document.getElementById('app');
  const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const read = (key, fallback='') => state.answers[key] ?? fallback;
  const save = () => {state.savedAt = Date.now(); try {localStorage.setItem(KEY,JSON.stringify(state));} catch (_) {}};
  const choice = (key, label, options) => `<div class="field"><label>${label}</label><div class="choice-grid">${options.map(([value,text,small])=>`<button type="button" class="choice ${read(key) === value ? 'selected':''}" data-choice="${key}" data-value="${escape(value)}">${escape(text)}${small?`<small>${escape(small)}</small>`:''}</button>`).join('')}</div></div>`;
  const select = (key, label, options) => `<div class="question-row"><div><strong>${label}</strong></div><select class="select" data-input="${key}"><option value="">Bir ilişki seç</option>${options.map(t=>`<option value="${escape(t)}" ${read(key)===t?'selected':''}>${escape(t)}</option>`).join('')}</select></div>`;
  const area = (key, label, placeholder, code=false, min=105) => `<div class="field"><label for="${key}">${label}</label><textarea id="${key}" class="${code?'codearea':'area'}" data-input="${key}" style="min-height:${min}px" placeholder="${escape(placeholder)}" spellcheck="${!code}">${escape(read(key))}</textarea>${code?'<small>Kod burada çalıştırılmaz. Çözümünüz PDF’ye aynen eklenir.</small>':''}</div>`;
  const checked = (key,label) => `<label class="inline-check"><input type="checkbox" data-checkbox="${key}" ${read(key)===true?'checked':''}>${label}</label>`;
  const pill = (text) => `<span class="tag">${text}</span>`;
  const card = (content, extra='') => `<section class="card ${extra}">${content}</section>`;
  const code = text => `<pre class="codebox">${escape(text)}</pre>`;
  const mins = m => `${m} DK`;
  const completeKeys = [
    ['uml.a','uml.b','uml.c','uml.d','uml.reason'],
    ['obj.result','obj.why','obj.member0','obj.member1','obj.member2','obj.member3'],
    ['enc.test0','enc.test1','enc.test2','enc.code','enc.reason'],
    ['super.output','super.code','super.reason'],
    ['interface.pick','interface.methods','interface.code'],
    ['abstract.pick','abstract.rule','abstract.code'],
    ['final.base','final.code','final.reason']
  ];
  function isDone(i){
    const answered=completeKeys[i].every(k=>{const v=read(k);return typeof v==='string'?v.trim().length>0:v!==undefined&&v!=='';});
    if(i===4)return answered&&['track','charge','swim'].some(k=>typeof read('interface.'+k)==='boolean');
    if(i===5)return answered&&['GorevAraci','Drone','DenizAraci','DenizRobotu'].some(k=>typeof read('abstract.'+k)==='boolean');
    if(i===6)return answered&&['track','charge'].some(k=>typeof read('final.'+k)==='boolean');
    return answered;
  }
  function doneCount(){return lessons.filter((_,i)=>isDone(i)).length;}
  function stamp(){
    const n=BigInt(state.id || '0');
    const hidden=(n ^ 0x5A71C3D9E2n).toString(36).toUpperCase().padStart(9,'0');
    const payload=JSON.stringify(state.answers) + ':' + (state.id||'') + ':NESNE-2026-01';
    let checksum=2166136261;
    for(let i=0;i<payload.length;i++){checksum^=payload.charCodeAt(i);checksum=Math.imul(checksum,16777619);}
    const width=state.id.length.toString(36).toUpperCase();
    return `NF-${width}${hidden}-${(checksum>>>0).toString(36).toUpperCase().padStart(7,'0')}`;
  }
  const elapsed = () => Math.floor((Date.now()-(state.startedAt||Date.now()))/60000);
  function renderStart(){
    root.innerHTML=`<main class="hero"><div class="hero-content"><div><div class="eyebrow">JAVA · UYGULAMALI LABORATUVAR</div><h1>Nesnelerin<br><em>mimarisi.</em></h1><p class="lead">Bir görev filosunun yazılım mimarı sensin. UML çizimlerini yorumla, nesneleri takip et, kuralları tasarla ve Java koduyla kararlarını kanıtla.</p><div class="summary-stats"><div><strong>60 dk</strong><small>laboratuvar</small></div><div><strong>7</strong><small>görev istasyonu</small></div><div><strong>1 PDF</strong><small>teslim çıktısı</small></div></div><div class="mission-meter"><strong>Görsel karar + kod üretimi</strong><div class="bar">${Array(7).fill(0).map((_,i)=>`<span class="${i<4?'on':''}"></span>`).join('')}</div><small>UML · Nesne/sınıf · Kapsülleme · Kalıtım · super · Interface · Abstract class</small></div></div><div class="hero-card"><div class="tag">ÖĞRENCİ GİRİŞİ</div><h2 style="margin-top:18px">Göreve hazır mısın?</h2><p>Öğrenci numaranı gir. Çalışmaların yalnızca bu tarayıcıda saklanır; sunucuya cevap gönderilmez.</p><form id="startForm"><div class="field"><label for="studentNo">Öğrenci numarası</label><input id="studentNo" class="input" type="text" inputmode="numeric" autocomplete="off" maxlength="15" pattern="[0-9]{5,15}" placeholder="Örn. 202612345" value="${escape(state.id)}" required><small>5–15 rakam. PDF’de numaran yerine kodlanmış öğrenci işareti görünür.</small></div><div id="startError" class="error" role="alert"></div><button class="btn primary" type="submit" style="width:100%;margin-top:8px">${state.startedAt?'Çalışmama devam et':'Laboratuvarı başlat'}</button></form><div class="note" style="margin-top:19px">Bu HTML dosyası internet olmadan açılır. Aynı cihazda çalış; kapatmadan önce PDF raporunu indir.</div></div></div></main>`;
  }
  function sideBar(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">N.</div><div><strong>NESNE LAB</strong><small>GÖREV FİLOSU / 2026</small></div></div><div class="mobile-progress">${doneCount()} / 7 istasyon tamamlandı · ${Math.max(0,60-elapsed())} dk hedef süre kaldı</div><div class="side-meta"><div class="tiny">Görev ilerlemesi</div><div class="big">${doneCount()} <span style="font-size:14px;color:#9fb5c6">/ 7</span></div><div class="progressbar"><span style="width:${doneCount()/7*100}%"></span></div></div><div class="nav-caption">İSTASYONLAR</div><nav class="mission-nav">${lessons.map((l,i)=>`<button class="navitem ${state.view===i?'active':''} ${isDone(i)?'done':''}" data-action="go" data-index="${i}"><span class="navnum">${isDone(i)?'✓':i+1}</span><span>${escape(l.short)}</span></button>`).join('')}<button class="navitem ${state.view===7?'active':''}" data-action="go" data-index="7"><span class="navnum">PDF</span><span>Teslim merkezi</span></button></nav><div class="asidefoot">Yanıtlar otomatik kaydedilir.<br>Bu bir otomatik Java derleyicisi değildir.</div></aside>`;}

  function station0(){let rel=['Kalıtım (extends)','Arayüz gerçekleştirme (implements)','İlişki / association','Bileşim / composition'];return `${card(`<div class="card-top">${pill('GÖRSEL ANALİZ')}<span class="subline">UML · 8 dakika</span></div><h2 style="margin-top:14px">Şekiller konuşuyor</h2><p class="muted">Dört farklı UML çizgisi var. Harfleri bağlantı türleriyle eşleştir. Dikkat: D çizgisindeki dolu elmasın yönünü de düşün.</p>${umlDiagram()}<div class="note" style="margin-top:14px">Üçgenin dolu veya boş olması, çizginin kesikli olması ve elmasın konumu anlamı değiştirir.</div>`)}${card(`<h2>01 / Bağlantıları çöz</h2>${select('uml.a','A — Düz çizgi, içi boş üçgen',rel)}${select('uml.b','B — Kesikli çizgi, içi boş üçgen',rel)}${select('uml.c','C — İki sınıf arasında düz çizgi',rel)}${select('uml.d','D — Filo ucunda dolu elmas',rel)}${area('uml.reason','02 / Bir kararını savun','“implements” yerine “extends” yazılırsa tasarım/derleme açısından ne değişir? En az iki cümle yaz.',false,104)}`)}`;}
  const memoryCode=`Drone d1 = new Drone("D-7", 80);\nDrone d2 = d1;\nd2.setEnerji(35);\nd2 = new Drone("D-9", 90);`;
  function memoryBoard(){const step=state.step;return `<div class="memory"><div class="mem-col"><h3>Stack / değişkenler</h3>${['d1','d2'].map((v,i)=>`<div class="mem-row" style="opacity:${i===1&&step===0?.35:1}"><span>${v}</span><span class="mem-arrow">${i===0?'↳ A':step===0?'—':step<3?'↳ A':'↳ B'}</span></div>`).join('')}</div><div class="mem-col"><h3>Heap / nesneler</h3><div class="obj-card"><strong>Nesne A</strong><div>kod: D-7</div><div>enerji: ${step<2?80:35}</div></div><div class="obj-card ${step===3?'':'muted'}"><strong>Nesne B</strong><div>kod: D-9</div><div>enerji: 90</div></div></div></div><div class="step-control"><button class="btn ghost small" data-action="stepBack" ${step===0?'disabled':''}>Önceki satır</button><div class="step-dots">${[0,1,2,3].map(i=>`<span class="step-dot ${i<=step?'on':''}"></span>`).join('')}</div><span class="muted" style="font-size:13px">${step+1} / 4 satır</span><button class="btn small" data-action="stepNext" ${step===3?'disabled':''}>Sonraki satır</button></div>`;}
  function station1(){const cat=['Alan / field','Kurucu / constructor','Metot / method','Nesne oluşturma / instantiation'];return `${card(`<div class="card-top">${pill('BELLEK SİMÜLASYONU')}<span class="subline">Nesne + sınıf · 7 dakika</span></div><h2 style="margin-top:14px">Aynı nesne, iki referans mı?</h2><p class="muted">Kod satırlarında ilerleyerek nesne kimliklerinin nasıl değiştiğini incele. Sonra simülasyonu gizlemeden kendi çıkarımını yap.</p>${code(memoryCode)}${memoryBoard()}`)}${card(`<h2>01 / Son durumu yorumla</h2>${choice('obj.result','Dört satır sonunda hangisi doğrudur?',[['same','d1 ile d2 aynı nesnedir'],['different','d1 ve d2 farklı nesneleri gösterir'],['invalid','Kod derleme hatası verir']])}${area('obj.why','02 / Neden?','Hangi satırda referans eşitliği bozuldu? d1.enerji ve d2.enerji kaçtır?')}`)}${card(`<h2>03 / Kod parçalarını sınıflandır</h2><p class="muted">Her parçanın bir Java sınıfının içindeki rolünü belirle.</p>${memberChips.map((m,i)=>`<div class="question-row"><div><div class="chip">${escape(m.code)}</div></div><select class="select" data-input="obj.member${i}"><option value="">Türü seç</option>${cat.map(c=>`<option ${read('obj.member'+i)===c?'selected':''}>${escape(c)}</option>`).join('')}</select></div>`).join('')}`)}`;}
  function station2(){const cases=[[-10,'enc.test0'],[65,'enc.test1'],[140,'enc.test2']];return `${card(`<div class="card-top">${pill('KURAL TASARIMI')}<span class="subline">Kapsülleme · 9 dakika</span></div><h2 style="margin-top:14px">Enerjiyi kim değiştirebilir?</h2><p class="muted">Drone enerji değeri 0–100 aralığında tutulmalıdır. Alan <code>private</code>. Dışarıdaki nesnelerin doğrudan yazmasını engelledin; peki setter ne yapacak?</p><div class="grid2"><div class="build-preview"><div class="preview-line">class Drone {</div><div class="preview-line">&nbsp; private int enerji;</div><div class="preview-line">&nbsp; // setter: ?</div><div class="preview-line">}</div></div><div class="note">Giriş geçersizse <code>IllegalArgumentException</code> fırlatılsın; nesnenin mevcut enerjisi değişmesin.</div></div>`)}${card(`<h2>01 / Birim test kartları</h2><p class="muted">Başlangıç enerjisi 80. Her test ayrı ve başlangıçtaki aynı nesne üzerinde çalışıyor.</p><div class="grid3">${cases.map(([n,k])=>`<div class="contract-card"><div class="symbol">${n<0?'−':n>100?'+':'✓'}</div><strong>setEnerji(${n})</strong><select class="select" data-input="${k}" aria-label="${n} test sonucu"><option value="">Beklenen sonuç?</option><option ${read(k)==='80 kalır / hata'?'selected':''}>80 kalır / hata</option><option ${read(k)==='Değer güncellenir'?'selected':''}>Değer güncellenir</option><option ${read(k)==='Program sonlanır'?'selected':''}>Program sonlanır</option></select></div>`).join('')}</div>`)}${card(`<h2>02 / Güvenli setter yaz</h2>${area('enc.code','Java: public void setEnerji(int yeniEnerji)','public void setEnerji(int yeniEnerji) {\n    // Geçersiz değerde hata fırlat\n    // Geçerliyse alanı güncelle\n}',true,210)}${area('enc.reason','03 / Neden private yeterli değil?','Alan private iken bile neden doğrulayıcı bir setter gerekir?')}`)}`;}
  const orderItems=['KameraDrone sınıfının kurucu gövdesi çalışır','new KameraDrone("K-4") çağrısı değerlendirilir','GorevAraci kurucusu çalışır','KameraDrone kurucusundaki super(kod) devreye girer'];
  function orderBoard(){return state.order.map((id,idx)=>`<div class="sorted-item"><div style="display:flex;gap:12px;align-items:center"><span class="navnum" style="color:#214a65;border-color:#cbdde8">${idx+1}</span><span>${escape(orderItems[id])}</span></div><div style="display:flex;gap:5px"><button data-action="up" data-index="${idx}" aria-label="Yukarı taşı" ${idx===0?'disabled':''}>↑</button><button data-action="down" data-index="${idx}" aria-label="Aşağı taşı" ${idx===3?'disabled':''}>↓</button></div></div>`).join('');}
  function station3(){return `${card(`<div class="card-top">${pill('AKIŞ SIRALAMASI')}<span class="subline">extends + super · 10 dakika</span></div><h2 style="margin-top:14px">Hangi kurucu önce?</h2><p class="muted">Dört olayı Java'nın gerçekleşme sırasına göre taşı. Her kartın sağındaki tuşları kullan.</p>${code('class GorevAraci {\n    protected String kod;\n    GorevAraci(String kod) { this.kod = kod; }\n    String etiket() { return "ARAC:" + kod; }\n}\nclass KameraDrone extends GorevAraci {\n    KameraDrone(String kod) { super(kod); }\n    @Override String etiket() {\n        return super.etiket() + ":KAMERA";\n    }\n}')}${orderBoard()}`)}${card(`<h2>01 / Metot çağrısı</h2>${choice('super.output','new KameraDrone("K-4").etiket() ne döndürür?',[['ARAC:K-4','ARAC:K-4'],['ARAC:K-4:KAMERA','ARAC:K-4:KAMERA'],['KAMERA:K-4','KAMERA:K-4']])}${area('super.reason','02 / super hangi iki yerde farklı görev yapıyor?','super(kod) ile super.etiket() arasında fark nedir?')}`)}${card(`<h2>03 / Kalıtımı tamamla</h2><p class="muted">Aşağıdaki sınıfı <code>GorevAraci</code> sınıfından türet. Kurucuda üst sınıfın kod bilgisini ayarla; <code>etiket()</code> metodunda üst sınıfın sonucuna <code>:TERMAL</code> ekle.</p>${area('super.code','Java: class TermalDrone ...','class TermalDrone extends GorevAraci {\n    // Kurucu ve override\n}',true,210)}`)}`;}
  function station4(){return `${card(`<div class="card-top">${pill('YETENEK HARİTASI')}<span class="subline">Interface · 8 dakika</span></div><h2 style="margin-top:14px">Sınıf mı, yetenek mi?</h2><p class="muted">Farklı araçlar aynı yeteneği paylaşabilir. Aşağıdaki kutuların her biri birer sözleşme; somut sınıfa uygun olanları seç.</p><div class="contract"><div class="contract-card"><span class="symbol">◎</span><strong>Izlenebilir</strong><p><code>void konumBildir()</code><br>Konum bilgisi gönderir.</p></div><div class="contract-card"><span class="symbol">ϟ</span><strong>SarjEdilebilir</strong><p><code>void sarjEt(int miktar)</code><br>Bataryayı günceller.</p></div><div class="contract-card"><span class="symbol">◈</span><strong>Yuzebilir</strong><p><code>void suyaGir()</code><br>Suda ilerler.</p></div></div>`)}${card(`<h2>01 / Robot için sözleşmeleri seç</h2><p class="muted"><strong>KaraRobotu:</strong> Konum raporlar, bataryasını şarj edebilir, fakat suya giremez. Birden fazla seçim gerekebilir.</p><div class="grid3">${checked('interface.track','Izlenebilir')}${checked('interface.charge','SarjEdilebilir')}${checked('interface.swim','Yuzebilir')}</div>${choice('interface.pick','Interface kullanmanın temel gerekçesi hangisi?',[['ability','Farklı sınıflara ortak yetenek sözleşmesi eklemek'],['state','Tüm nesnelerin alanlarını tek sınıfta saklamak'],['constructor','Alt sınıfa otomatik kurucu sağlamak']])}${area('interface.methods','02 / Uygulanması gereken metot imzalarını yaz','KaraRobotu bu iki arayüzü implements ederse hangi public metotları sağlamak zorundadır?')}`)}${card(`<h2>03 / Sözleşmeyi gerçekleştir</h2><p class="muted">Aşağıdaki iki arayüzün metotlarını implement eden <code>KaraRobotu</code> sınıfını yaz. Metot gövdeleri kısa olabilir, fakat derlenebilir olmalarına dikkat et.</p>${area('interface.code','Java sınıfını yaz','class KaraRobotu implements Izlenebilir, SarjEdilebilir {\n    // İki public metodu yaz\n}',true,220)}`)}`;}
  function abstractDiagram(){return `<div class="diagram-wrap"><svg class="uml-svg" viewBox="0 0 720 290" aria-label="Soyut sınıf ağacı: GorevAraci üstte, Drone ve DenizAraci altta, DenizRobotu DenizAraci altındadır"><defs><marker id="tri2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11Z" fill="white" stroke="#466b83" stroke-width="1.5"/></marker></defs><rect class="uml-box" x="265" y="13" width="190" height="75" rx="5"/><text x="360" y="33" font-size="13" text-anchor="middle">«abstract»</text><text x="360" y="53" font-size="16" font-style="italic" font-weight="700" text-anchor="middle">GorevAraci</text><text x="360" y="73" font-size="12" text-anchor="middle">+ goreviYurut()</text><rect class="uml-box" x="90" y="135" width="175" height="63" rx="5"/><text x="177" y="172" font-size="17" font-weight="700" text-anchor="middle">Drone</text><rect class="uml-box" x="455" y="135" width="175" height="63" rx="5"/><text x="542" y="160" font-size="13" text-anchor="middle">«abstract»</text><text x="542" y="181" font-size="16" font-style="italic" font-weight="700" text-anchor="middle">DenizAraci</text><rect class="uml-box" x="455" y="234" width="175" height="48" rx="5"/><text x="542" y="265" font-size="16" font-weight="700" text-anchor="middle">DenizRobotu</text><path class="uml-connector" d="M177 135 V113 H360 V90" marker-end="url(#tri2)"/><path class="uml-connector" d="M542 135 V113 H360"/><path class="uml-connector" d="M542 234 V202" marker-end="url(#tri2)"/><text x="370" y="110" font-size="11" fill="#6b8498">extends</text></svg></div>`;}
  function station5(){return `${card(`<div class="card-top">${pill('SINIF AĞACI')}<span class="subline">Abstract class · 8 dakika</span></div><h2 style="margin-top:14px">Hangisinden new yapılır?</h2><p class="muted">İtalik adlar ve <code>«abstract»</code> etiketleri tasarımın parçası. Ağaçtaki sınıflara bak; <code>new</code> ile doğrudan üretilebilenleri seç.</p>${abstractDiagram()}<div class="grid2" style="margin-top:14px">${['GorevAraci','Drone','DenizAraci','DenizRobotu'].map(s=>checked('abstract.'+s,escape(s))).join('')}</div>`)}${card(`<h2>01 / Soyutlama kararı</h2>${choice('abstract.pick','Neden GorevAraci abstract sınıf olmalı?',[['template','Ortak durum/davranışı paylaşırken bazı davranışları alt sınıfa zorunlu bırakmak'],['many','Bir Java sınıfının aynı anda birden çok sınıfı extend etmesi için'],['static','Bütün alanları static yapmak için']])}${area('abstract.rule','02 / Abstract class ve interface ayrımı','Aynı projede neden hem abstract class hem interface gerekebilir? Bir somut örnek ver.')}`)}${card(`<h2>03 / Taslak gövdeyi yaz</h2><p class="muted"><code>GorevAraci</code> için <code>protected String kod</code> alanı, bu alanı kuran bir constructor, somut <code>getKod()</code> metodu ve soyut <code>void goreviYurut()</code> oluştur.</p>${area('abstract.code','Java: abstract class GorevAraci','abstract class GorevAraci {\n    // alan, kurucu, somut metot, soyut metot\n}',true,230)}`)}`;}
  function station6(){const base=read('final.base')||'GorevAraci';let traits=[read('final.track')===true?'Izlenebilir':null,read('final.charge')===true?'SarjEdilebilir':null].filter(Boolean);return `${card(`<div class="card-top">${pill('FİNAL: MİMARİ KARAR')}<span class="subline">Bütünleştirme · 8 dakika</span></div><h2 style="margin-top:14px">Yeni görev: AmfibiRobot</h2><p class="muted">Kara ve suda hareket edebilen, izlenebilir ve şarj edilebilir bir robot geliştiriyorsun. Mevcut <code>GorevAraci</code> soyut sınıfında <code>kod</code> alanı ve <code>goreviYurut()</code> sözleşmesi var.</p><div class="grid2"><div>${choice('final.base','01 / Kalıtım için en uygun seçim',[['GorevAraci','GorevAraci','Ortak araç durumu ve davranışı'],['Izlenebilir','Izlenebilir','Konum bildirme sözleşmesi'],['Object','Sadece Object','Mevcut tasarımın özel hiyerarşisini kullanmamak']])}</div><div><div class="field"><label>02 / Arayüzleri seç</label><div class="checklist">${checked('final.track','Izlenebilir')}${checked('final.charge','SarjEdilebilir')}</div></div></div></div><div class="build-preview"><div class="section-title">CANLI MİMARİ ÖNİZLEMESİ</div><div class="preview-line">AmfibiRobot</div><div class="preview-line">extends ${escape(base)}</div><div class="preview-line">implements ${traits.length?escape(traits.join(', ')):'(Henüz seçilmedi)'}</div><div class="preview-line">+ goreviYurut()</div><div class="preview-line">+ karadaIlerle(), + suyaGir()</div></div>`)}${card(`<h2>03 / Derlenebilir sınıf tasarla</h2><p class="muted">Yukarıdaki mimari kararlarını koda dök. Üst sınıfın constructor'ını <code>super(kod)</code> ile çağır. Soyut metodu override et, seçtiğin interface metotlarını public olarak yaz. Davranışları basit <code>System.out.println</code> ile gösterebilirsin.</p>${area('final.code','Java: AmfibiRobot sınıfı','class AmfibiRobot extends GorevAraci implements Izlenebilir, SarjEdilebilir {\n    // constructor + override + arayüz metotları\n}',true,255)}${area('final.reason','04 / Tasarım savunması','Bu tasarımda kalıtım ve arayüzleri birlikte kullanmanın avantajını; sadece kalıtım kullansaydın ortaya çıkabilecek bir problemi açıkla.',false,115)}<div class="note">Son istasyonda otomatik derleme yok: PDF hem tasarımını hem kodunu içerecek. Öğretim elemanı kodun doğruluğunu inceleyebilir.</div>`)}`;}
  const screens=[station0,station1,station2,station3,station4,station5,station6];
  function renderLesson(){const i=state.view,l=lessons[i];shell(`<div class="lessonhead"><div><div class="eyebrow">GÖREV ${String(i+1).padStart(2,'0')} / 07</div><h1>${escape(l.title)}</h1><p class="lead">${escape(l.topic)}</p></div><div class="timepill">${mins(l.minutes)}</div></div>${screens[i]()}<div class="footnav"><div class="statusrow"><span class="statusmark"></span>Otomatik kaydediliyor · ${isDone(i)?'Tüm zorunlu alanlar dolu':'Bazı cevaplar henüz boş'}</div><div class="footnav-right"><button class="btn ghost" data-action="prev" ${i===0?'disabled':''}>Önceki</button><button class="btn primary" data-action="next">${i===6?'Teslim merkezine git':'Sonraki istasyon'}</button></div></div>`);}
  function renderEnd(){const total=doneCount();shell(`<div class="eyebrow">TESLİM MERKEZİ</div><h1>Görev kaydı hazır.</h1><p class="lead">Tüm seçimler, yazdığın açıklamalar ve Java kodların tek bir PDF'ye aktarılır. Bu dosyayı indirip Classroom'a yükle.</p>${card(`<div class="card-top">${pill('ÖĞRENCİ MÜHRÜ')}<span class="subline">Numara PDF’de açıkça gösterilmez</span></div><h2 style="margin-top:20px">Kodlanmış teslim kimliği</h2><div class="outline-code">${escape(stamp())}</div><p class="muted" style="font-size:14px">Bu kod öğrenci numarana ve o andaki yanıtlarına dayanır. Yanıtlar değişirse son bölüm değişebilir. Tek başına güvenli kimlik doğrulaması değildir.</p><hr class="separate"><h3>Yanıt kontrol listesi</h3><div class="grid2">${lessons.map((l,i)=>`<div class="checkline"><b style="color:${isDone(i)?'#388052':'#bb893a'}">${isDone(i)?'✓':'○'}</b><span>${escape(l.title)}</span><span class="muted" style="margin-left:auto">${isDone(i)?'Dolu':'Eksik'}</span></div>`).join('')}</div><p class="muted" style="margin-top:17px">Yanıt girişi: ${total}/7 istasyon · Geçen süre: ${elapsed()} dakika. Bu, doğruluk puanı değildir.</p>`)}${card(`<h2>PDF dosyanı indir</h2><div class="download-box"><div><strong>NESNE LAB / Öğrenci raporu</strong><p class="muted" style="margin:7px 0">Yanıtların ve Java kodların · A4 PDF · Sunucuya gönderim yok</p></div><button class="btn primary" id="downloadButton" data-action="pdf">PDF'yi indir</button></div>${total<7?`<div class="note warn" style="margin-top:15px">${7-total} istasyonda boş alan var. PDF yine oluşturulabilir; dilersen önce geri dönüp tamamla.</div>`:''}<div class="note" style="margin-top:15px">PDF indirildikten sonra adını değiştirmeden Classroom'a yükle. Dosya adındaki <strong>NF</strong> kodu teslimi eşleştirmek için kullanılır.</div>`)}<div class="footnav"><button class="btn ghost" data-action="go" data-index="6">Son istasyona dön</button><button class="btn textual" data-action="reset">Bu cihazdaki çalışmayı sıfırla</button></div>`);}
  function render(){if(!state.startedAt)renderStart();else if(state.view===7)renderEnd();else renderLesson();}
  function change(k,v){state.answers[k]=v;save();}
  root.addEventListener('submit',event=>{if(event.target.id!=='startForm')return;event.preventDefault();const input=document.getElementById('studentNo');const number=input.value.trim();if(!/^\d{5,15}$/.test(number)){document.getElementById('startError').textContent='Lütfen yalnızca 5–15 rakamdan oluşan öğrenci numaranı gir.';return;}if(state.id&&state.id!==number){if(Object.keys(state.answers).length&&!confirm('Farklı öğrenci numarası girildi. Bu tarayıcıdaki önceki cevaplar sıfırlanacak. Devam edilsin mi?'))return;state=init();}state.id=number;state.startedAt=state.startedAt||Date.now();state.view=Math.max(0,Math.min(7,state.view));save();render();});
  root.addEventListener('input',event=>{const el=event.target;if(!el.dataset.input)return;change(el.dataset.input,el.value);});
  root.addEventListener('change',event=>{const el=event.target;if(el.dataset.checkbox){change(el.dataset.checkbox,el.checked);if(state.view===6)render();}else if(el.dataset.input){change(el.dataset.input,el.value);}});
  root.addEventListener('keydown',event=>{const el=event.target;if(el.classList.contains('codearea')&&event.key==='Tab'){event.preventDefault();const p=el.selectionStart;el.value=el.value.slice(0,p)+'    '+el.value.slice(el.selectionEnd);el.selectionStart=el.selectionEnd=p+4;change(el.dataset.input,el.value);}});
  root.addEventListener('click',async event=>{const el=event.target.closest('[data-action],[data-choice]');if(!el)return;if(el.dataset.choice){change(el.dataset.choice,el.dataset.value);render();return;}const a=el.dataset.action;const i=Number(el.dataset.index);if(a==='go'){state.view=i;save();render();}else if(a==='prev'||a==='next'){state.view=Math.max(0,Math.min(7,state.view+(a==='next'?1:-1)));save();render();window.scrollTo(0,0);}else if(a==='exit'){save();state.startedAt=0;render();}else if(a==='stepBack'||a==='stepNext'){state.step=Math.max(0,Math.min(3,state.step+(a==='stepNext'?1:-1)));state.visited=Array.from(new Set([...state.visited,state.step]));save();render();}else if(a==='up'||a==='down'){let next=i+(a==='up'?-1:1);if(next>=0&&next<state.order.length){[state.order[i],state.order[next]]=[state.order[next],state.order[i]];save();render();}}else if(a==='reset'){if(confirm('Bu tarayıcıdaki tüm laboratuvar cevaplarını kalıcı olarak silmek istiyor musun?')){localStorage.removeItem(KEY);state=init();render();}}else if(a==='pdf'){const btn=el;btn.disabled=true;btn.textContent='PDF hazırlanıyor...';try{await new Promise(resolve=>setTimeout(resolve,40));await exportPDF();btn.textContent='PDF indirildi';}catch(error){console.error(error);btn.disabled=false;btn.textContent='PDF’yi yeniden dene';alert('PDF oluşturulamadı. Tarayıcı belleğini kontrol edip yeniden dene.');}finally{setTimeout(()=>{if(btn.isConnected){btn.disabled=false;btn.textContent='PDF’yi indir';}},1200);}}});
  setInterval(()=>{const timer=document.getElementById('timer');if(timer&&state.startedAt)timer.textContent=`⏱ ${String(Math.floor(elapsed()/60)).padStart(2,'0')}:${String(elapsed()%60).padStart(2,'0')} / 60 dk`;},15000);

  const reportFields = [
    [['A bağlantısı','uml.a'],['B bağlantısı','uml.b'],['C bağlantısı','uml.c'],['D bağlantısı','uml.d'],['Karar gerekçesi','uml.reason']],
    [['Nesne referanslarının sonucu','obj.result'],['Açıklama','obj.why'],...memberChips.map((c,i)=>[c.code,'obj.member'+i])],
    [['Test -10','enc.test0'],['Test 65','enc.test1'],['Test 140','enc.test2'],['Setter Java kodu','enc.code'],['Kapsülleme gerekçesi','enc.reason']],
    [['Kurucu olaylarının sırası','@order'],['Etiket çıktısı','super.output'],['super açıklaması','super.reason'],['TermalDrone Java kodu','super.code']],
    [['Seçilen arayüzler','@interfaces'],['Temel gerekçe','interface.pick'],['Metot imzaları','interface.methods'],['KaraRobotu Java kodu','interface.code']],
    [['Üretilebilir sınıflar','@abstracts'],['Abstract gerekçesi','abstract.pick'],['Abstract/interface ayrımı','abstract.rule'],['GorevAraci Java kodu','abstract.code']],
    [['Üst sınıf tercihi','final.base'],['Seçilen arayüzler','@finalinterfaces'],['AmfibiRobot Java kodu','final.code'],['Tasarım savunması','final.reason']]
  ];
  function reportValue(key){if(key==='@order')return state.order.map((id,i)=>`${i+1}. ${orderItems[id]}`).join('\n');if(key==='@interfaces')return ['track','charge','swim'].filter(t=>read('interface.'+t)===true).map(t=>({track:'Izlenebilir',charge:'SarjEdilebilir',swim:'Yuzebilir'})[t]).join(', ')||'Seçilmedi';if(key==='@abstracts')return ['GorevAraci','Drone','DenizAraci','DenizRobotu'].filter(t=>read('abstract.'+t)===true).join(', ')||'Seçilmedi';if(key==='@finalinterfaces')return ['track','charge'].filter(t=>read('final.'+t)===true).map(t=>t==='track'?'Izlenebilir':'SarjEdilebilir').join(', ')||'Seçilmedi';return String(read(key)||'(Yanıt girilmedi)');}
  async function exportPDF(){
    const W=1240,H=1754,MX=86,LEFT=MX,RIGHT=W-MX,BOTTOM=H-118;
    const pages=[];let cv=null,ctx=null,y=0,pageNumber=0;
    function newPage(){if(cv)pages.push(cv);cv=document.createElement('canvas');cv.width=W;cv.height=H;ctx=cv.getContext('2d',{alpha:false});ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0e223a';ctx.fillRect(0,0,W,18);ctx.fillStyle='#accf7d';ctx.fillRect(LEFT,64,74,7);ctx.fillStyle='#7b8d9d';ctx.font='700 21px system-ui, sans-serif';ctx.fillText('NESNE LABORATUVARI  /  2026',LEFT,114);ctx.fillStyle='#bcc9d3';ctx.fillRect(LEFT,142,RIGHT-LEFT,2);ctx.fillStyle='#677d91';ctx.font='18px system-ui, sans-serif';ctx.fillText('Öğrenci çalışma raporu · otomatik değerlendirme içermez',LEFT,H-72);ctx.fillText(`Sayfa ${++pageNumber}`,RIGHT-105,H-72);y=196;}
    function wrap(text,maxWidth,font){ctx.font=font;const lines=[];for(const raw of String(text).replace(/\r/g,'').split('\n')){if(!raw){lines.push('');continue;}let current='';const words=raw.replace(/\t/g,'    ').split(/(\s+)/);for(const w of words){if(ctx.measureText(current+w).width<=maxWidth){current+=w;continue;}if(current.trim())lines.push(current.trimEnd());current='';if(ctx.measureText(w).width<=maxWidth){current=w.trimStart();continue;}let piece='';for(const char of w){if(ctx.measureText(piece+char).width>maxWidth&&piece){lines.push(piece);piece='';}piece+=char;}current=piece;}lines.push(current.trimEnd());}return lines;}
    function makeRoom(needed){if(y+needed>BOTTOM)newPage();}
    function line(text,{font='25px system-ui, sans-serif',color='#253e55',height=38,indent=0,code=false}={}){const width=RIGHT-LEFT-indent-(code?28:0);const lines=wrap(text,width,font);for(const t of lines){makeRoom(height);ctx.font=font;ctx.fillStyle=color;ctx.fillText(t,LEFT+indent+(code?14:0),y);y+=height;}return lines.length;}
    function section(title,subtitle){makeRoom(120);y+=14;ctx.fillStyle='#edf5ea';ctx.fillRect(LEFT,y-25,RIGHT-LEFT,76);ctx.fillStyle='#214c42';ctx.font='700 31px system-ui, sans-serif';ctx.fillText(title,LEFT+18,y+10);y+=76;line(subtitle,{font:'21px system-ui, sans-serif',color:'#70849a',height:31});y+=9;}
    function field(label,value,codeField=false){const labelFont='700 23px system-ui, sans-serif', bodyFont=codeField?'22px monospace':'24px system-ui, sans-serif';const parts=wrap(value,RIGHT-LEFT-(codeField?45:0),bodyFont);const rowHeight=codeField?32:37;makeRoom(60+Math.min(parts.length,4)*rowHeight);line(label,{font:labelFont,color:'#20415a',height:34});y+=7;for(let p=0;p<parts.length;p++){makeRoom(rowHeight);if(codeField){ctx.fillStyle='#f2f6f8';ctx.fillRect(LEFT,y-23,RIGHT-LEFT,rowHeight+5);}ctx.font=bodyFont;ctx.fillStyle=codeField?'#2c4052':'#45576a';ctx.fillText(parts[p],LEFT+(codeField?14:0),y);y+=rowHeight;}y+=24;}
    newPage();line('GÖREV FİLOSU',{font:'700 56px system-ui, sans-serif',color:'#152d46',height:80});line('Bireysel Java laboratuvar raporu',{font:'30px system-ui, sans-serif',color:'#536d82',height:48});y+=20;ctx.fillStyle='#eaf3e0';ctx.fillRect(LEFT,y,RIGHT-LEFT,135);y+=43;line('KODLANMIŞ ÖĞRENCİ İŞARETİ',{font:'700 22px system-ui, sans-serif',color:'#50734a',height:33,indent:24});line(stamp(),{font:'700 38px monospace',color:'#163b32',height:55,indent:24});y+=56;field('Çalışma tarihi',new Date().toLocaleString('tr-TR'));field('Tamamlanan istasyon',`${doneCount()} / 7 · Bu bir doğruluk puanı değildir.`);field('Öğrencinin geçen süresi',`${elapsed()} dakika (hedef: 60 dakika)`);line('Bu raporda görsel etkinlik seçimleri, açıklamalar ve Java kodları bulunur.',{font:'24px system-ui',color:'#64788c',height:37});y+=18;line('Not: Çalışma tarayıcıda tutulur. Kodlanmış işaret, tek başına', {font:'22px system-ui',color:'#71859b',height:34});line('öğrencinin kimliğini veya cevapların doğruluğunu kanıtlamaz.',{font:'22px system-ui',color:'#71859b',height:34});
    for(let i=0;i<lessons.length;i++){section(`İSTASYON ${i+1} · ${lessons[i].short}`,`${lessons[i].minutes} dakika · ${lessons[i].topic}`);for(const [label,key] of reportFields[i])field(label,reportValue(key),/code/.test(key));}
    pages.push(cv);
    const images=[];
    for(let i=0;i<pages.length;i++){const data=pages[i].toDataURL('image/jpeg',0.82).split(',')[1];const binary=atob(data);const bytes=new Uint8Array(binary.length);for(let j=0;j<binary.length;j++)bytes[j]=binary.charCodeAt(j);images.push(bytes);await new Promise(resolve=>setTimeout(resolve,0));}
    const out=[];let size=0;const offsets=[0];const enc=new TextEncoder();const write=v=>{const arr=typeof v==='string'?enc.encode(v):v;out.push(arr);size+=arr.length;};
    const obj=(id,head,body,tail='')=>{offsets[id]=size;write(`${id} 0 obj\n${head}\n`);if(body)write(body);write('\n');if(tail)write(`${tail}\n`);write('endobj\n');};
    write('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
    const pageIds=images.map((_,i)=>3+i*3);
    obj(2,`<< /Type /Pages /Kids [${pageIds.map(x=>`${x} 0 R`).join(' ')}] /Count ${images.length} >>`);
    for(let i=0;i<images.length;i++){
      const pageId=3+3*i,contentId=pageId+1,imageId=pageId+2;
      const draw=`q 595.28 0 0 841.89 0 0 cm /Im0 Do Q\n`;
      obj(pageId,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${imageId} 0 R >> >> /Contents ${contentId} 0 R >>`);
      obj(contentId,`<< /Length ${enc.encode(draw).length} >>\nstream\n${draw}endstream`);
      obj(imageId,`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${images[i].length} >>\nstream`,images[i],'endstream');
    }
    const xref=size;write(`xref\n0 ${3+images.length*3}\n0000000000 65535 f \n`);
    for(let id=1;id<3+images.length*3;id++)write(`${String(offsets[id]).padStart(10,'0')} 00000 n \n`);
    write(`trailer\n<< /Size ${3+images.length*3} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    const blob=new Blob(out,{type:'application/pdf'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`NesneLab_${stamp()}.pdf`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  }
  render();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
})();
